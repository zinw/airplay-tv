<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradAv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182B"/>
      <stop offset="50%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <linearGradient id="tvBezelAv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#41506E"/>
      <stop offset="20%" stop-color="#242E42"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>

    <linearGradient id="tvScreenAv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18233C"/>
      <stop offset="50%" stop-color="#0E1527"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>

    <linearGradient id="airplayNeonAv" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#0077FE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="arc1Av" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="arc2Av" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="arc3Av" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="standGradAv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5875"/>
      <stop offset="50%" stop-color="#263044"/>
      <stop offset="100%" stop-color="#141A26"/>
    </linearGradient>

    <linearGradient id="glassReflectionAv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="29%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="tvElevationAv" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="backlightAv" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>

    <filter id="neonGlowAv" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screenClipAv">
      <rect x="70" y="86" width="372" height="256" rx="16"/>
    </clipPath>
  </defs>

  <!-- Full bleed circle or square background -->
  <rect width="512" height="512" fill="url(#bgGradAv)"/>

  <!-- Backlight Glow -->
  <circle cx="256" cy="190" r="160" fill="#00F5FF" opacity="0.16" filter="url(#backlightAv)"/>
  <circle cx="256" cy="250" r="140" fill="#9333EA" opacity="0.18" filter="url(#backlightAv)"/>

  <!-- TV Hardware Layer -->
  <g filter="url(#tvElevationAv)">
    <path d="M244 358 L244 388 L268 388 L268 358 Z" fill="url(#standGradAv)"/>
    <path d="M172 388 C172 384 176 382 184 382 L328 382 C336 382 340 384 340 388 L346 395 C346 398 342 400 334 400 L178 400 C170 400 166 398 166 395 Z" 
          fill="url(#standGradAv)" stroke="#3E4E6E" stroke-width="1.2"/>
    <line x1="184" y1="384" x2="328" y2="384" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

    <rect x="54" y="70" width="404" height="288" rx="26" fill="url(#tvBezelAv)" stroke="#4A5C7E" stroke-width="2"/>
    <rect x="68" y="84" width="376" height="260" rx="18" fill="#080C14" stroke="#1C2436" stroke-width="1.2"/>

    <g clip-path="url(#screenClipAv)">
      <rect x="70" y="86" width="372" height="256" rx="16" fill="url(#tvScreenAv)"/>

      <circle cx="256" cy="260" r="110" fill="#00F5FF" opacity="0.22" filter="url(#neonGlowAv)"/>
      <circle cx="256" cy="210" r="90" fill="#9333EA" opacity="0.26" filter="url(#neonGlowAv)"/>

      <path d="M138 238 C166 170 208 136 256 136 C304 136 346 170 374 238" 
            fill="none" stroke="url(#arc3Av)" stroke-width="8" stroke-linecap="round"/>

      <path d="M170 250 C192 196 222 168 256 168 C290 168 320 196 342 250" 
            fill="none" stroke="url(#arc2Av)" stroke-width="10" stroke-linecap="round" filter="url(#neonGlowAv)"/>

      <path d="M202 262 C216 224 234 202 256 202 C278 202 296 224 310 262" 
            fill="none" stroke="url(#arc1Av)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlowAv)"/>

      <g filter="url(#neonGlowAv)">
        <path d="M256 208 L320 298 C326 307 319 316 308 316 L204 316 C193 316 186 307 192 298 Z" 
              fill="url(#airplayNeonAv)"/>
        <path d="M256 218 L300 284 C304 290 300 295 294 295 L218 295 C212 295 208 290 212 284 Z" 
              fill="#FFFFFF" opacity="0.32"/>
      </g>

      <rect x="70" y="86" width="372" height="256" rx="16" fill="url(#glassReflectionAv)"/>
    </g>

    <circle cx="256" cy="345" r="3.2" fill="#00F5FF" filter="url(#neonGlowAv)"/>
    <circle cx="256" cy="345" r="1.4" fill="#FFFFFF"/>
  </g>
</svg>