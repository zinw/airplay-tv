name: Release Build & Publish

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Compute Short SHA and Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/AirPlayTV-${SHORT_SHA}-release.apk"
          cd release-artifacts
          sha256sum "AirPlayTV-${SHORT_SHA}-release.apk" > "AirPlayTV-${SHORT_SHA}-release.apk.sha256"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ### 📺 AirPlay TV Production Release `${{ steps.meta.outputs.short_sha }}`
            
            **Commit:** [`${{ steps.meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            #### 📦 Included Artifacts
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-release.apk`: Signed production-ready APK with all ABI architectures (`arm64-v8a`, `armeabi-v7a`, `x86_64`)
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-release.apk.sha256`: SHA-256 Checksum
            
            #### 🚀 Quick Install via ADB
            ```bash
            adb connect <YOUR_ANDROID_TV_IP>
            adb install -r AirPlayTV-${{ steps.meta.outputs.short_sha }}-release.apk
            ```
          files: |
            release-artifacts/AirPlayTV-${{ steps.meta.outputs.short_sha }}-release.apk
            release-artifacts/AirPlayTV-${{ steps.meta.outputs.short_sha }}-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
